[tool.poetry]
name = "customer-mlops"
version = "1.0.0"
description = "MLOps pipeline for Consumer Complaint Dispute Prediction"
authors = ["Your Name"]
packages = [
    { include = "steps" },
    { include = "pipelines" },
    { include = "app" },
    { include = "core" }
]

[tool.poetry.dependencies]
python = "^3.11"
zenml = "0.96.1"
mlflow = "3.14.0"
evidently = "0.7.21"
scikit-learn = "1.9.0"
xgboost = "<3.3.0"
lightgbm = "4.6.0"
numpy = "*"
pandas = "*"
passlib = "*"
sqlmodel = "*"

[tool.poetry.group.dev.dependencies]
black = ">=23.0.0"
ruff = ">=0.1.0"
pytest = "*"

[project.optional-dependencies]
dev = [
    "black",           # Add this
    "ruff",            # Ensure this is present
    "pytest",          # Ensure this is present
    # ... other dev dependencies
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
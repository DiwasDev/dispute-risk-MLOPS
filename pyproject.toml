[tool.poetry]
name = "customer-mlops"
version = "1.0.0"
description = "MLOps pipeline for Consumer Complaint Dispute Prediction"
authors = ["Your Name"]
packages = [
    { include = "steps" },
    { include = "pipelines" },
    { include = "app" },
    { include = "core" }
]

[tool.poetry.dependencies]
python = "^3.12"
# Core orchestration + experiment tracking
zenml = "0.96.1"
mlflow = "3.14.0"
# zenml[local] dependencies (required for `zenml up` / `zenml login --local`)
# zenml 0.96.1 requires sqlmodel==0.0.38 exactly for its local store
sqlmodel = "0.0.38"
sqlalchemy-utils = ">=0.37.0"
bcrypt = "4.0.1"
passlib = "~1.7.4"
alembic = ">=1.8.1,<=1.15.2"
pymysql = ">=1.1.1,<1.2.0"
jsonschema = ">=4.0.0"
# Data + monitoring
evidently = "0.7.21"
# Azure Blob Storage — required for AzureBlobDataLoader (optional at runtime;
# only imported when source_type="azure" is passed to ingest_data step).
azure-storage-blob = ">=12.19.0,<13.0.0"
# ML
scikit-learn = "1.9.0"
xgboost = ">=3.0.0,<3.3.0"
lightgbm = "4.6.0"
numpy = "*"
pandas = "*"


[tool.poetry.group.dev.dependencies]
black = ">=23.0.0"
ruff = ">=0.1.0"
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
